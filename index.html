<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roof Simulator</title>
</head>
<body>
<header>
  <div id="brand"><h1 data-i18n="site.title">Roof Simulator</h1>
    <p id="desc" data-i18n="site.desc"></p></div>
<div id="right">
  <div id="langSel" role="group" data-i18n-aria="lang.label"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2.5 2.5 2.5 9.5 0 12M8 2c-2.5 2.5-2.5 9.5 0 12"/></svg><button data-lang="en">EN</button><button data-lang="fr">FR</button></div>
  <button id="about" data-i18n="btn.about">About</button>
</div>
</header>
<div id="main">
  <div id="bar">
<div id="tools">
  <fieldset class="grp"><legend data-i18n="group.roof">Roof</legend>
    <label><span data-i18n="mode.label">Method</span> <select id="mode">
      <option value="none" data-i18n="mode.none"></option>
      <option value="skel" data-i18n="mode.skel"></option>
      <option value="nearest" data-i18n="mode.nearest"></option>
      <option value="points" data-i18n="mode.points"></option>
    </select></label>
    <label id="slopeBox"><span data-i18n="slope.label">Slope</span> <input id="slope" type="range" min="15" max="60" value="40"> <b id="slopeV">40&deg;</b></label>
  </fieldset>
  <fieldset class="grp" id="viewGrp"><legend data-i18n="group.view">View</legend>
    <label id="arcsBox" data-i18n-title="arcs.title"><input id="arcs" type="checkbox"> <span data-i18n="arcs.label">skeleton</span></label>
    <label><input id="iso" type="checkbox"> <span data-i18n="iso.label">isolines</span></label>
    <label id="cutBox" data-i18n-title="cut.title"><input id="cutOn" type="checkbox"> <span data-i18n="cut.label">level</span> <input id="cut" type="range" min="0" max="100" value="50"> <b id="cutV"></b></label>
  </fieldset>
  <span id="note"></span>
  <span id="msg" role="alert" hidden></span>
</div>
</div>
<div id="tourCol">
  <button id="tourToggle" hidden data-i18n="btn.tour" data-i18n-title="btn.tour.title">Guided tour</button>
  <aside id="tour" data-i18n-aria="tour.aria"></aside>
</div>
<div id="panes">
  <div class="pane"><canvas id="c2d"></canvas>
  <span class="cap" id="cap2d" data-i18n="cap.2d"></span>
  <div id="box2d">
  <div id="drawBar" role="toolbar" data-i18n-aria="group.drawing">
    <button id="clear" data-i18n-title="btn.clear.title"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M6.5 4V2.5h3V4M4.5 4l.6 9h5.8l.6-9"/></svg><span data-i18n="btn.clear">Clear</span></button>
    <select id="preset" data-i18n-aria="preset.label">
      <option value="" data-i18n="preset.placeholder"></option>
      <option value="rectangle" data-i18n="preset.rectangle">Rectangle</option>
      <option value="L" data-i18n="preset.L">L</option>
      <option value="T" data-i18n="preset.T">T</option>
      <option value="U" data-i18n="preset.U">U</option>
      <option value="irregular" data-i18n="preset.irregular">Irregular</option>
      <option value="gableHouse" data-i18n="preset.gableHouse">Gable house</option>
      <option value="lGables" data-i18n="preset.lGables">L with gables</option>
    </select>
  </div>
    <div id="edgeBox" hidden>
      <div class="ehead"><span data-i18n="edge.title">Edge</span> <b id="eN"></b></div>
      <div class="erow"><label class="rad"><input type="radio" name="em" value="hip"> <span data-i18n="edge.hip">Hip</span></label>
        <span class="sl eslope"><span data-i18n="edge.slope">slope=</span><b id="eSlopeV"></b></span>
        <input id="eSlope" class="eslope" type="range" min="15" max="75" value="40">
        <label class="glob eslope" data-i18n-title="edge.global.title"><input id="eGlobal" type="checkbox"> <span data-i18n="edge.global">global</span></label></div>
      <div class="erow"><label class="rad"><input type="radio" name="em" value="gable"> <span data-i18n="edge.gable">Gable (speed=0)</span></label></div>
      <div class="erow"><button id="eAdd" data-i18n-title="edge.add.title"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg><span data-i18n="edge.add">Add point</span></button></div>
      <div class="small" data-i18n="edge.help"></div></div>
    <div id="vertBox" hidden><span data-i18n="vert.title">Point</span> <b id="vN"></b> <button id="vDel" data-i18n-title="vert.delete.title"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg><span data-i18n="vert.delete">Delete point</span></button></div>
  </div>
    <div id="bl"><div id="legend"></div>
    <div class="hint" data-i18n="hint"></div></div></div>
  <div class="pane"><canvas id="c3d"></canvas><span class="cap" data-i18n="cap.3d"></span></div>
</div>
</div>
<div id="modal" hidden><div class="box" role="dialog" data-i18n-aria="about.aria">
  <button class="x" id="modalX" data-i18n-aria="about.close">&times;</button>
  <h2 data-i18n="about.title">About this demo</h2>
  <div data-i18n-html="about.body"></div>
</div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
